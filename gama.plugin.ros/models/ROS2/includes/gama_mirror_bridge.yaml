# ros_gz_bridge configuration for "05 Gazebo mirror".
#
# One entry per entity, all in the same direction: GAMA speaks, Gazebo listens. Nothing comes back,
# because in this model Gazebo has no opinion of its own -- it is a viewer.
#
#   ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=gama_mirror_bridge.yaml
#
# The ROS topic name is kept identical to the Gazebo one so that `ros2 topic list` and `gz topic -l`
# read the same, which makes a name typed differently on the two sides easy to spot.

- ros_topic_name: "/model/gama_0/cmd_vel"
  gz_topic_name: "/model/gama_0/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

