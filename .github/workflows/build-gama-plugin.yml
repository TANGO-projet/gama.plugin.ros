name: "[GAMA Plugin] Java CI with Maven"

on:
  push:
    # p2-deploy holds generated p2 metadata, not sources: there is nothing to build there.
    branches-ignore:
      - p2-deploy
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 25

    # The GAMA p2 repository is published per release train, in directories named
    # after the branch without its prefix (branch GAMA_2026-06 -> .../2026-06).
    # Branches that are not release trains build against the default branch's train.
    - name: Derive GAMA p2 version from branch name
      run: |
        BRANCH="${{ github.ref_name }}"
        if [[ ! "$BRANCH" =~ ^GAMA_[0-9]{4}-[0-9]{2}$ ]]; then
          BRANCH="${{ github.event.repository.default_branch }}"
        fi
        echo "GAMA_P2_VERSION=${BRANCH#GAMA_}" >> "$GITHUB_ENV"
        echo "Building against GAMA p2 repository ${BRANCH#GAMA_}"

    - name: Build with Maven
      working-directory: "gama.plugin.parent"
      run: mvn --batch-mode clean verify -Dgama.p2.version="${GAMA_P2_VERSION}"
